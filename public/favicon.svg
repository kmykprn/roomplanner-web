<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- アプリアイコン。白い地に黄緑（#8bc516）の椅子（正面）。
       マスク（丸・角丸）で切られても欠けないよう、図柄は中央 60% の安全領域に収めている。
       PNG（pwa-192x192 / pwa-512x512 / apple-touch-icon / favicon-32x32）はこのファイルから作る -->
  <rect width="512" height="512" fill="#ffffff"/>
  <g fill="#8bc516">
    <rect x="168" y="86" width="176" height="178" rx="30"/>
    <rect x="128" y="250" width="256" height="60" rx="16"/>
    <rect x="146" y="306" width="36" height="120" rx="10"/>
    <rect x="330" y="306" width="36" height="120" rx="10"/>
  </g>
  <g fill="#ffffff">
    <rect x="200" y="118" width="112" height="22" rx="8"/>
    <rect x="200" y="160" width="112" height="22" rx="8"/>
    <rect x="200" y="202" width="112" height="22" rx="8"/>
  </g>
</svg>
