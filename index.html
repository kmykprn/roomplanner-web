<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover で safe-area-inset-* が有効になる -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5f5f5" />

    <!-- ホーム画面に追加したときに、アドレスバーなしの全画面で起動させる -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="RoomPlanner" />

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <title>RoomPlanner</title>
    <!--
      開いた直後に出すアイコンの画面。JavaScript を読む前から出すため、ここに直接書く。
      消すのは src/main.ts（読み込みが終わり、かつ 1.5 秒たったら薄くなって消える）。
      指の操作は通す（押せない時間を作らない。消えるのを待たせるためのものではない）
    -->
    <style>
      .splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f5f5;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }
      .splash.is-leaving {
        opacity: 0;
      }
      .splash img {
        width: 120px;
        height: 120px;
        border-radius: 26px;
      }
      @media (prefers-reduced-motion: reduce) {
        .splash {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="splash" id="splash" aria-hidden="true"><img src="pwa-192x192.png" alt="" width="120" height="120" /></div>
    <div id="app">
      <header class="header">
        <span class="header__title">部屋の模様替え</span>
      </header>
      <div class="viewport" id="viewport"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
