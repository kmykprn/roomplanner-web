# PR と main への push で、ビルド（型チェック込み）と画面のテスト（Playwright）を動かす。
# main はこの「test」が通らないとマージできない（ブランチ保護で必須にしている）
name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# 同じ PR に続けて push したら、古いほうは止める
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 型チェック（tsc --noEmit）も走る
      - run: npm run build

      - run: npx playwright install --with-deps chromium

      - run: npm test

      # 落ちたときに、どこで落ちたかを見られるように残す
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
