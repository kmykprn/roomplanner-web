# main への push で GitHub Pages へ自動デプロイする。
# 初回のみ、リポジトリの Settings > Pages で Source を "GitHub Actions" に設定する必要がある。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # 手動実行も可能にしておく

permissions:
  contents: read
  pages: write
  id-token: write

# デプロイが重ならないようにする。新しい push を優先する
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # npm run build は型チェック（tsc --noEmit）も走るので、
      # 型エラーがあればここでデプロイが止まる
      - run: npm run build
        env:
          DEPLOY_BASE: /roomplanner-web/
          # 秘密ではない（ビルド後のJSに必ず入る）が、リポジトリには置かない。
          # 理由は src/config/api.ts のコメントを参照。
          # 未設定でもビルドは通り、生成タブにその旨が出る
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
